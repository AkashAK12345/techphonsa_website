<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <!-- Outer chamfered frame — angular octagonal form -->
  <polygon
    points="13,2 27,2 38,13 38,27 27,38 13,38 2,27 2,13"
    stroke="#4BA8FF"
    stroke-width="1.5"
    fill="none"
    opacity="0.9"
  />
  <!-- Inner ring — subtle -->
  <circle cx="20" cy="20" r="10" stroke="#4BA8FF" stroke-width="0.75" opacity="0.3"/>
  <!-- Cardinal tick marks -->
  <line x1="20" y1="2"  x2="20" y2="7"  stroke="#4BA8FF" stroke-width="1.5" opacity="0.7"/>
  <line x1="20" y1="33" x2="20" y2="38" stroke="#4BA8FF" stroke-width="1.5" opacity="0.7"/>
  <line x1="2"  y1="20" x2="7"  y2="20" stroke="#4BA8FF" stroke-width="1.5" opacity="0.7"/>
  <line x1="33" y1="20" x2="38" y2="20" stroke="#4BA8FF" stroke-width="1.5" opacity="0.7"/>
  <!-- T letterform — crossbar -->
  <rect x="11" y="15" width="18" height="2.5" fill="#F5F7FA" rx="0.5"/>
  <!-- T letterform — stem -->
  <rect x="18" y="17.5" width="4" height="9" fill="#F5F7FA" rx="0.5"/>
  <!-- Corner accent dots -->
  <rect x="12.5" y="3.5"  width="2.5" height="2.5" fill="#4BA8FF" opacity="0.5"/>
  <rect x="25"   y="3.5"  width="2.5" height="2.5" fill="#4BA8FF" opacity="0.5"/>
  <rect x="12.5" y="34"   width="2.5" height="2.5" fill="#4BA8FF" opacity="0.5"/>
  <rect x="25"   y="34"   width="2.5" height="2.5" fill="#4BA8FF" opacity="0.5"/>
</svg>
